name: CI/CD Pipeline

on:
    push:
        branches: [main, develop, feature/**]
    pull_request:
        branches: [main, develop]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install flake8
              run: pip install flake8
            - name: Run flake8
              run: flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

    test:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install dependencies
              run: pip install -r backend/test-requirements.txt
            - name: Run tests
              working-directory: backend
              run: pytest -v

    security:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install dependencies
              run: pip install -r backend/test-requirements.txt
            - name: Security scan
              run: |
                  pip install safety bandit
                  bandit -r ./backend -x ./backend/venv || true

    build-backend:
        needs: security
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        steps:
            - uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build backend
              run: |
                  REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
                  docker build -t ghcr.io/$REPO_NAME/backend:${{ github.sha }} ./backend

    build-frontend:
        needs: security
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        steps:
            - uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build frontend
              run: |
                  REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
                  docker build -t ghcr.io/$REPO_NAME/frontend:${{ github.sha }} ./frontend

    push:
        needs: [build-backend, build-frontend]
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
        steps:
            - uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Tag and push backend
              run: |
                  REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
                  docker build -t ghcr.io/$REPO_NAME/backend:${{ github.sha }} ./backend
                  docker build -t ghcr.io/$REPO_NAME/backend:latest ./backend
                  docker push ghcr.io/$REPO_NAME/backend:${{ github.sha }}
                  docker push ghcr.io/$REPO_NAME/backend:latest
            - name: Tag and push frontend
              run: |
                  REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
                  docker build -t ghcr.io/$REPO_NAME/frontend:${{ github.sha }} ./frontend
                  docker build -t ghcr.io/$REPO_NAME/frontend:latest ./frontend
                  docker push ghcr.io/$REPO_NAME/frontend:${{ github.sha }}
                  docker push ghcr.io/$REPO_NAME/frontend:latest

    deploy:
        needs: push
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Deploy to production
              run: echo "Deploy triggered"
