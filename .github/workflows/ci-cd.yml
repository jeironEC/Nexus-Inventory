name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read
    packages: write

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install flake8
              run: pip install flake8
            - name: Run flake8
              run: flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

    test:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('backend/test-requirements.txt') }}
            - name: Install dependencies
              run: pip install -r backend/test-requirements.txt
            - name: Run tests
              working-directory: backend
              run: pytest -v

    security:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install dependencies
              run: pip install -r backend/test-requirements.txt
            - name: Security scan
              run: |
                  pip install safety bandit
                  bandit -r ./backend -x ./backend/venv,./backend/tests

    build:
        needs: security
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        outputs:
            image_tag: ${{ steps.meta.outputs.version }}

        steps:
            - uses: actions/checkout@v4

            - name: Extract metadata
              id: meta
              run: |
                  SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
                  echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT

            - name: Lowercase repo
              id: repo
              run: |
                  echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Write SSL certificates
              run: |
                  mkdir -p ssl
                  echo "${{ secrets.SSL_CERT }}" > ssl/server.crt
                  echo "${{ secrets.SSL_KEY }}" > ssl/server.key

            - name: Login to GHCR
              if: github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build (and push if main) backend
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  push: ${{ github.ref == 'refs/heads/main' }}
                  tags: |
                      ghcr.io/${{ steps.repo.outputs.value }}/backend:${{ steps.meta.outputs.version }}
                      ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/backend:latest', steps.repo.outputs.value) || '' }}

            - name: Build (and push if main) frontend
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  push: ${{ github.ref == 'refs/heads/main' }}
                  tags: |
                      ghcr.io/${{ steps.repo.outputs.value }}/frontend:${{ steps.meta.outputs.version }}
                      ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/frontend:latest', steps.repo.outputs.value) || '' }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Deploy
              run: echo "Deploying version ${{ needs.build.outputs.image_tag }}"
