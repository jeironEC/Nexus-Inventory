services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: nexus_inventory_backend:latest
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: nexus_inventory_backend.settings
      DJANGO_CONFIGURATION: Docker
      SECRET_KEY: docker-secret-key-please-no-hack-me
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DATABASE_NAME: nexus_inventory
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
