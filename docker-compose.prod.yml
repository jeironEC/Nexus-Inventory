services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=nexus_inventory_backend.settings
      - DJANGO_CONFIGURATION=Production
      - DATABASE_HOST=db
      - SECURE_SSL_REDIRECT=True
    volumes:
      - ./ssl:/app/ssl:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/ssl:ro
    depends_on:
      - backend
    networks:
      - nexus_net
    restart: unless-stopped

networks:
  nexus_net:
    driver: bridge

volumes:
  postgres_data:
