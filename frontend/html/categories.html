<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/categories.css">

    <link rel="icon" type="image/svg+xml" href="../assets/Nexus_Inventory_Logo.svg">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <main class="main-content" id="main-content">

            <!-- Header -->
            <div id="page-header-container"></div>

            <div class="page-body section-stack">

                <!-- ── Filtros ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Filtros</h3>
                    </div>
                    <div class="filter-grid">

                        <div class="form-group">
                            <label class="form-label" for="categories-filter-name">Nombre de la Categoría</label>
                            <input type="text" class="form-input" id="categories-filter-name" placeholder="Nombre de la categoría...">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="categories-filter-state">Estado</label>
                            <select class="form-input" id="categories-filter-state">
                                <option value="">Todos los estados</option>
                                <option value="active">Activo</option>
                                <option value="inactive">Inactivo</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="categories-filter-date-from">Desde</label>
                            <input type="date" class="form-input" id="categories-filter-date-from">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="categories-filter-date-to">Hasta</label>
                            <input type="date" class="form-input" id="categories-filter-date-to">
                        </div>

                        <div class="filter-actions">
                            <button class="btn btn-secondary" id="btn-apply-filters">
                                <span class="material-symbols-outlined">filter_list</span>
                                Aplicar Filtros
                            </button>
                        </div>

                    </div>
                </div>

                <!-- ── Tabla ── -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Estado</th>
                                    <th>Creado por</th>
                                    <th>Fecha Creación</th>
                                    <th>Última Modificación</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="categories-tbody">
                                <!-- Datos dinámicos del backend -->
                            </tbody>
                        </table>
                    </div>
                    <div id="categories-pagination" class="pagination">
                        <button class="pagination-btn" aria-label="Página anterior" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn active">1</button>
                        <button class="pagination-btn" aria-label="Página siguiente">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <span class="pagination-info">Mostrando registros de categorías</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ── Modal: Crear Categoría ── -->
    <div class="modal-backdrop" id="modal-new-category" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Nueva Categoría</h3>
                <button class="modal-close" aria-label="Cerrar">&times;</button>
            </div>

            <form id="form-new-category">
                <div class="modal-body">

                    <div class="form-group">
                        <label class="form-label" for="new-category-name">Nombre</label>
                        <input type="text" class="form-input" id="new-category-name" name="name" placeholder="Ej: Electrónica">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-category-description">Descripción</label>
                        <textarea class="form-input" id="new-category-description" name="description" rows="4" placeholder="Describe la categoría..."></textarea>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-outlined">save</span>
                        Crear Categoría
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Componentes globales -->
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/page_header.js"></script>
    <!-- Lógica de la página -->
    <script src="../js/pages/categories.js"></script>
</body>
</html>
