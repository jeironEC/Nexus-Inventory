<!DOCTYPE html>
<html lang="es">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Empresa - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
</head>
<body>
    <!-- Skip link para accesibilidad -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Contenido principal -->
        <main class="main-content" id="main-content">
            <!-- Encabezado de página -->
            <div id="page-header-container"></div>

            <div class="page-body section-stack">

                <!-- ── Tarjeta de cabecera de la empresa ── -->
                <div class="card account-card-header">
                    <div class="account-logo-header-wrapper">
                        <div class="account-logo-header" id="company-logo-header">
                            <span class="material-symbols-outlined">business</span>
                        </div>
                        <button type="button" class="account-logo-edit" id="company-logo-edit" aria-label="Cambiar logo">
                            <span class="material-symbols-outlined">photo_camera</span>
                        </button>
                        <input type="file" id="logo-input" name="logo_file" accept="image/*" style="display: none;">
                    </div>
                    <div class="account-info">
                        <h2 class="account-name" id="company-display-name">Nombre de la Empresa</h2>
                        <p class="account-nif" id="company-display-nif">NIF: B12345678</p>
                        <span class="badge badge-success" id="company-state">Activa</span>
                    </div>
                </div>

                <!-- ── Datos de la Empresa ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Datos de la Empresa</h3>
                    </div>

                    <form id="form-company-info">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="company-name">Nombre de la Empresa</label>
                                <input type="text" class="form-input" id="company-name" name="name" placeholder="Mi Empresa S.L.">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="company-nif">NIF / CIF</label>
                                <input type="text" class="form-input" id="company-nif" name="nif" placeholder="B12345678">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="company-email">Correo electrónico</label>
                                <input type="email" class="form-input" id="company-email" name="email" placeholder="contacto@empresa.com">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="company-phone">Teléfono</label>
                                <input type="tel" class="form-input" id="company-phone" name="number_phone" placeholder="+34 600 000 000" pattern="^\+34[0-9 ]{6,}$" title="Debe comenzar con +34 seguido del número">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="company-website">Sitio Web</label>
                            <input type="url" class="form-input" id="company-website" name="website" placeholder="https://www.empresa.com">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="company-address">Dirección</label>
                            <textarea class="form-input" id="company-address" name="address" rows="3" placeholder="Calle, número, ciudad, código postal..."></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btn-save-company">
                                <span class="material-symbols-outlined">save</span>
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>

                <!-- ── Recursos (Términos y Manual) ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Recursos</h3>
                    </div>

                    <div class="account-resources">
                        <a href="/html/terms.html" class="account-resource-link">
                            <span class="material-symbols-outlined">description</span>
                            <div class="account-resource-text">
                                <span class="account-resource-title">Términos y Condiciones</span>
                                <span class="account-resource-desc">Lee los términos de uso de Nexus Inventory</span>
                            </div>
                            <span class="material-symbols-outlined account-resource-arrow">chevron_right</span>
                        </a>

                        <a href="/html/manual.html" class="account-resource-link">
                            <span class="material-symbols-outlined">menu_book</span>
                            <div class="account-resource-text">
                                <span class="account-resource-title">Manual de Uso</span>
                                <span class="account-resource-desc">Aprende a usar todas las funciones del sistema</span>
                            </div>
                            <span class="material-symbols-outlined account-resource-arrow">chevron_right</span>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Componentes -->
    <script type="module" src="/js/components/Modal.js"></script>
    <script type="module" src="/js/components/Sidebar.js"></script>
    <script type="module" src="/js/components/PageHeader.js"></script>

    <!-- Scripts de la página -->
    <script type="module" src="/js/pages/company.js"></script>
</body>
</html>
