<!DOCTYPE html>
<html lang="es">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/modal.css">

    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body>
    <!-- Skip link para accesibilidad -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Contenido principal -->
        <main class="main-content">
            <!-- Encabezado de página -->
            <div id="page-header-container"></div>

            <div class="page-body section-stack">
                <!-- KPI resumen -->
                <div class="stats-grid mb-4">
                    <div class="card-kpi">
                        <span class="material-symbols-outlined card-kpi-icon">inventory_2</span>
                        <div class="card-kpi-value" data-kpi="total_products">0</div>
                        <div class="card-kpi-label">Total Productos</div>
                    </div>
                    <div class="card-kpi">
                        <span class="material-symbols-outlined card-kpi-icon">payments</span>
                        <div class="card-kpi-value" data-kpi="total_value">€ 0.00</div>
                        <div class="card-kpi-label">Valor Total</div>
                    </div>
                    <div class="card-kpi">
                        <span class="material-symbols-outlined card-kpi-icon">warning</span>
                        <div class="card-kpi-value" data-kpi="low_stock_count">0</div>
                        <div class="card-kpi-label">Stock Bajo</div>
                    </div>
                    <div class="card-kpi">
                        <span class="material-symbols-outlined card-kpi-icon">error</span>
                        <div class="card-kpi-value" data-kpi="no_stock_count">0</div>
                        <div class="card-kpi-label">Sin Stock</div>
                    </div>
                </div>

                 <!-- Filtros -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Filtros</h3>
                    </div>
                    <div class="card-body">
                        <div class="filter-grid">
                            <div class="form-group">
                                <label class="form-label">Producto</label>
                                <select class="form-input form-select" id="inventory-filter-product-id">
                                    <option value="">Todos los productos</option>
                                    <!-- Dinámico -->
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-input" id="inventory-filter-product-name" placeholder="Buscar por nombre...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Stock Mín.</label>
                                <input type="number" class="form-input" id="inventory-filter-quantity-min" placeholder="0">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Stock Máx.</label>
                                <input type="number" class="form-input" id="inventory-filter-quantity-max" placeholder="0">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Fecha Desde</label>
                                <input type="date" class="form-input" id="inventory-filter-date-from">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Fecha Hasta</label>
                                <input type="date" class="form-input" id="inventory-filter-date-to">
                            </div>
                            <div class="filter-actions">
                                <button class="btn btn-secondary w-full" id="btn-apply-filters">
                                    <span class="material-symbols-outlined">filter_list</span>
                                    Aplicar Filtros
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabla -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination">
                        <button class="pagination-btn" aria-label="Página anterior" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn" aria-label="Página siguiente">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <span class="pagination-info">Mostrando registros</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Componentes -->
    <script type="module" src="/js/components/Modal.js"></script>
    <script type="module" src="/js/components/Sidebar.js"></script>
    <script type="module" src="/js/components/PageHeader.js"></script>

    <!-- Scripts de la página -->
    <script type="module" src="/js/pages/inventory.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</body>
</html>
