<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/invoices.css">

    <link rel="icon" type="image/svg+xml" href="../assets/Nexus_Inventory_Logo.svg">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">

        <div id="sidebar-container"></div>

        <main class="main-content" id="main-content">

            <div id="page-header-container"></div>

            <div class="page-body section-stack">

                <!-- ── Filtros ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Filtros</h3>
                    </div>
                        <div class="filter-grid">

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-type">Tipo de Factura</label>
                                <select class="form-input" id="invoices-filter-type">
                                    <option value="">Todos los tipos</option>
                                    <option value="SALE">Venta</option>
                                    <option value="PURCHASE">Compra</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-state">Estado</label>
                                <select class="form-input" id="invoices-filter-state">
                                    <option value="">Todos los estados</option>
                                    <option value="ISSUED">Emitida</option>
                                    <option value="PAID">Pagada</option>
                                    <option value="CANCELLED">Cancelada</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-payment">Método de Pago</label>
                                <select class="form-input" id="invoices-filter-payment">
                                    <option value="">Todos los métodos</option>
                                    <option value="CASH">Efectivo</option>
                                    <option value="CARD">Tarjeta</option>
                                    <option value="TRANSFER">Transferencia</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-customer">Cliente</label>
                                <select class="form-input" id="invoices-filter-customer">
                                    <option value="">Todos los clientes</option>
                                    <!-- Se rellena dinámico desde el backend -->
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-pdf">PDF Generado</label>
                                <select class="form-input" id="invoices-filter-pdf">
                                    <option value="">Todos</option>
                                    <option value="true">Generado</option>
                                    <option value="false">No Generado</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-sale">Venta</label>
                                <select class="form-input" id="invoices-filter-sale">
                                    <option value="">Todas las ventas</option>
                                    <!-- Se rellena dinámico desde el backend -->
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-purchase">Compra</label>
                                <select class="form-input" id="invoices-filter-purchase">
                                    <option value="">Todas las compras</option>
                                    <!-- Se rellena dinámico desde el backend -->
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-date-from">Desde</label>
                                <input type="date" class="form-input" id="invoices-filter-date-from">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="invoices-filter-date-to">Hasta</label>
                                <input type="date" class="form-input" id="invoices-filter-date-to">
                            </div>

                            <div class="filter-actions">
                                <button class="btn btn-secondary" id="btn-apply-filters">
                                    <span class="material-symbols-outlined">filter_list</span>
                                    Aplicar Filtros
                                </button>
                            </div>

                        </div>
                </div>

                <!-- ── Tabla ── -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nº Factura</th>
                                    <th>Tipo</th>
                                    <th>Cliente / Proveedor</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="invoices-tbody">
                                <!-- Datos dinámicos del backend -->
                            </tbody>
                        </table>
                    </div>
                    <div id="invoices-pagination" class="pagination">
                        <button class="pagination-btn" aria-label="Página anterior" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn active">1</button>
                        <button class="pagination-btn" aria-label="Página siguiente">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <span class="pagination-info">Mostrando registros de facturas</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Componentes globales -->
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/page_header.js"></script>
    <!-- Lógica de la página -->
    <script src="../js/pages/invoices.js"></script>
</body>
</html>
