<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/products.css">

    <link rel="icon" type="image/svg+xml" href="../assets/Nexus_Inventory_Logo.svg">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">

        <div id="sidebar-container"></div>

        <main class="main-content" id="main-content">

            <div id="page-header-container"></div>

            <div class="page-body section-stack">

                <!-- ── Acciones de la página ── -->
                <div class="page-actions">
                    <button class="btn btn-primary" id="btn-new-product">
                        <span class="material-symbols-outlined">add</span>
                        Nuevo Producto
                    </button>
                </div>

                <!-- ── Filtros (según ProductFilter del backend) ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Filtros</h3>
                    </div>
                    <div class="filter-grid">

                        <div class="form-group">
                            <label class="form-label" for="products-filter-name">Nombre</label>
                            <input type="text" class="form-input" id="products-filter-name" placeholder="Nombre del producto...">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="products-filter-unique-code">Código Único</label>
                            <input type="text" class="form-input" id="products-filter-unique-code" placeholder="Código...">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="products-filter-category">Categoría</label>
                            <select class="form-input" id="products-filter-category">
                                <option value="">Todas las categorías</option>
                                <!-- Se rellena dinámico desde el backend -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="products-filter-state">Estado</label>
                            <select class="form-input" id="products-filter-state">
                                <option value="">Todos los estados</option>
                                <option value="active">Activo</option>
                                <option value="inactive">Inactivo</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="products-filter-price-min">Precio Mín.</label>
                            <input type="number" step="0.01" class="form-input" id="products-filter-price-min" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="products-filter-price-max">Precio Máx.</label>
                            <input type="number" step="0.01" class="form-input" id="products-filter-price-max" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="products-filter-date-from">Desde</label>
                            <input type="date" class="form-input" id="products-filter-date-from">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="products-filter-date-to">Hasta</label>
                            <input type="date" class="form-input" id="products-filter-date-to">
                        </div>

                        <div class="filter-actions">
                            <button class="btn btn-secondary" id="btn-apply-filters">
                                <span class="material-symbols-outlined">filter_list</span>
                                Aplicar Filtros
                            </button>
                        </div>

                    </div>
                </div>

                <!-- ── Tabla ── -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>P. Venta</th>
                                    <th>P. Compra</th>
                                    <th>Descuento</th>
                                    <th>Estado</th>
                                    <th>Fecha Creación</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="products-tbody">
                                <!-- Datos dinámicos del backend -->
                            </tbody>
                        </table>
                    </div>
                    <div id="products-pagination" class="pagination">
                        <button class="pagination-btn" aria-label="Página anterior" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn active">1</button>
                        <button class="pagination-btn" aria-label="Página siguiente">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <span class="pagination-info">Mostrando registros de productos</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ── Modal: Crear Producto ── -->
    <!-- (campos según POST /v1/products del backend) -->
    <div class="modal-backdrop" id="modal-new-product" style="display:none;">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 class="modal-title">Nuevo Producto</h3>
                <button class="modal-close" aria-label="Cerrar">&times;</button>
            </div>

            <form id="form-new-product">
                <div class="modal-body">

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="new-product-name">Nombre</label>
                            <input type="text" class="form-input" id="new-product-name" name="name" placeholder="Ej: Teclado mecánico RGB">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="new-product-unique-code">Código Único</label>
                            <input type="text" class="form-input" id="new-product-unique-code" name="unique_code" placeholder="Ej: TEC-RGB-001">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-product-category">Categoría</label>
                        <select class="form-input" id="new-product-category" name="category_id">
                            <option value="">Selecciona una categoría</option>
                            <!-- Se rellena dinámico desde el backend -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-product-description">Descripción</label>
                        <textarea class="form-input" id="new-product-description" name="description" rows="3" placeholder="Describe el producto..."></textarea>
                    </div>

                    <div class="form-row form-row-3">
                        <div class="form-group">
                            <label class="form-label" for="new-product-sale-price">Precio Venta (€)</label>
                            <input type="number" step="0.01" class="form-input" id="new-product-sale-price" name="sale_price" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="new-product-purchase-price">Precio Compra (€)</label>
                            <input type="number" step="0.01" class="form-input" id="new-product-purchase-price" name="purchase_price" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="new-product-discount">Descuento (%)</label>
                            <input type="number" step="0.01" class="form-input" id="new-product-discount" name="discount_percentage" placeholder="0.00">
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-outlined">save</span>
                        Crear Producto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Componentes globales -->
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/page_header.js"></script>
    <!-- Lógica de la página -->
    <script src="../js/pages/products.js"></script>
</body>
</html>
