<!DOCTYPE html>
<html lang="es">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body>
    <!-- Skip link para accesibilidad -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Contenido principal -->
        <main class="main-content" id="main-content">
            <!-- Encabezado de página -->
            <div id="page-header-container"></div>

            <div class="page-body section-stack">

                <!-- ── Tarjeta de cabecera del perfil ── -->
                <div class="card account-card-header">
                    <div class="account-avatar-wrapper">
                        <div class="account-avatar" id="profile-avatar">
                            <span id="profile-avatar-initials">NX</span>
                        </div>
                    </div>
                    <div class="account-info">
                        <h2 class="account-name" id="profile-name">Nombre Apellidos</h2>
                        <p class="account-email" id="profile-email">correo@ejemplo.com</p>
                        <span class="badge badge-primary" id="profile-role">Rol</span>
                    </div>
                </div>

                <!-- ── Información Personal ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Información Personal</h3>
                    </div>

                    <form id="form-profile-info">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="profile-first-name">Nombre</label>
                                <input type="text" class="form-input" id="profile-first-name" name="first_name" placeholder="Tu nombre">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="profile-last-name">Apellidos</label>
                                <input type="text" class="form-input" id="profile-last-name" name="last_name" placeholder="Tus apellidos">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="profile-email-input">Correo electrónico</label>
                                <input type="email" class="form-input" id="profile-email-input" name="email" placeholder="correo@ejemplo.com">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="profile-nif">NIF</label>
                                <input type="text" class="form-input" id="profile-nif" name="nif" placeholder="12345678X">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="profile-role-select">Rol</label>
                                <select class="form-input form-select" id="profile-role-select" name="role">
                                    <option value="">Cargando roles...</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btn-save-profile">
                                <span class="material-symbols-outlined">save</span>
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>

                <!-- ── Recursos Términos y Manual ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Recursos</h3>
                    </div>

                    <div class="account-resources">
                        <a href="/html/terms.html" class="account-resource-link">
                            <span class="material-symbols-outlined">description</span>
                            <div class="account-resource-text">
                                <span class="account-resource-title">Términos y Condiciones</span>
                                <span class="account-resource-desc">Lee los términos de uso de Nexus Inventory</span>
                            </div>
                            <span class="material-symbols-outlined account-resource-arrow">chevron_right</span>
                        </a>

                        <a href="/html/manual.html" class="account-resource-link">
                            <span class="material-symbols-outlined">menu_book</span>
                            <div class="account-resource-text">
                                <span class="account-resource-title">Manual de Uso</span>
                                <span class="account-resource-desc">Aprende a usar todas las funciones del sistema</span>
                            </div>
                            <span class="material-symbols-outlined account-resource-arrow">chevron_right</span>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Componentes -->
    <script type="module" src="/js/components/Modal.js"></script>
    <script type="module" src="/js/components/Sidebar.js"></script>
    <script type="module" src="/js/components/PageHeader.js"></script>

    <!-- Scripts de la página -->
    <script type="module" src="/js/pages/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</body>
</html>
