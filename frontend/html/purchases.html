<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/purchases.css">

    <link rel="icon" type="image/svg+xml" href="../assets/Nexus_Inventory_Logo.svg">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">

        <div id="sidebar-container"></div>

        <main class="main-content" id="main-content">

            <div id="page-header-container"></div>

            <div class="page-body section-stack">

                <!-- ── Filtros ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Filtros</h3>
                    </div>
                    <div class="filter-grid">

                        <div class="form-group">
                            <label class="form-label" for="purchases-filter-supplier">Proveedor</label>
                            <select class="form-input" id="purchases-filter-supplier">
                                <option value="">Todos los proveedores</option>
                                <!-- Se rellena dinámico desde el backend -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="purchases-filter-state">Estado</label>
                            <select class="form-input" id="purchases-filter-state">
                                <option value="">Todos los estados</option>
                                <option value="PENDING">Pendiente</option>
                                <option value="COMPLETED">Completada</option>
                                <option value="CANCELLED">Cancelada</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="purchases-filter-date-from">Desde</label>
                            <input type="date" class="form-input" id="purchases-filter-date-from">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="purchases-filter-date-to">Hasta</label>
                            <input type="date" class="form-input" id="purchases-filter-date-to">
                        </div>

                        <div class="filter-actions">
                            <button class="btn btn-secondary" id="btn-apply-filters">
                                <span class="material-symbols-outlined">filter_list</span>
                                Aplicar Filtros
                            </button>
                        </div>

                    </div>
                </div>

                <!-- ── Tabla ── -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nº Compra</th>
                                    <th>Proveedor</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="purchases-tbody">
                                <!-- Datos dinámicos del backend -->
                            </tbody>
                        </table>
                    </div>
                    <div id="purchases-pagination" class="pagination">
                        <button class="pagination-btn" aria-label="Página anterior" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn active">1</button>
                        <button class="pagination-btn" aria-label="Página siguiente">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <span class="pagination-info">Mostrando registros de compras</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ── Modal: Crear Compra ── -->
    <div class="modal-backdrop" id="modal-new-purchase" style="display:none;">
        <div class="modal modal-xl">
            <div class="modal-header">
                <h3 class="modal-title">Nueva Compra</h3>
                <button class="modal-close" aria-label="Cerrar">&times;</button>
            </div>

            <form id="form-new-purchase">
                <div class="modal-body">

                    <!-- Datos generales -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="new-purchase-company">Empresa</label>
                            <select class="form-input" id="new-purchase-company" name="company_id">
                                <option value="">Selecciona empresa</option>
                                <!-- Se rellena dinámico desde el backend -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="new-purchase-supplier">Proveedor</label>
                            <select class="form-input" id="new-purchase-supplier" name="supplier_id">
                                <option value="">Selecciona proveedor</option>
                                <!-- Se rellena dinámico desde el backend -->
                            </select>
                        </div>
                    </div>

                    <!-- Detalles: productos de la compra -->
                    <div class="purchase-details">
                        <div class="purchase-details-header">
                            <h4 class="purchase-details-title">Productos</h4>
                            <button type="button" class="btn btn-secondary btn-sm" id="btn-add-product">
                                <span class="material-symbols-outlined">add</span>
                                Añadir Producto
                            </button>
                        </div>

                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th>Cantidad</th>
                                        <th>Coste Unitario</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="purchase-details-tbody">
                                    <!-- Por defecto una fila vacía -->
                                    <tr class="purchase-detail-row">
                                        <td>
                                            <select class="form-input" name="product_id">
                                                <option value="">Selecciona producto</option>
                                                <!-- Se rellena dinámico -->
                                            </select>
                                        </td>
                                        <td>
                                            <input type="number" class="form-input" name="quantity" placeholder="1" min="1" value="1">
                                        </td>
                                        <td>
                                            <input type="number" step="0.01" class="form-input" name="unit_cost" placeholder="0.00">
                                        </td>
                                        <td class="purchase-detail-subtotal">€ 0.00</td>
                                        <td>
                                            <button type="button" class="table-action-btn danger btn-remove-row" title="Eliminar">
                                                <span class="material-symbols-outlined">delete</span>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Total -->
                        <div class="purchase-totals">
                            <div class="purchase-total-row purchase-total-final">
                                <span class="purchase-total-label">Total:</span>
                                <span class="purchase-total-value" id="purchase-total">€ 0.00</span>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-outlined">save</span>
                        Crear Compra
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Componentes globales -->
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/page_header.js"></script>
    <!-- Lógica de la página -->
    <script src="../js/pages/purchases.js"></script>
</body>
</html>
