<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Devoluciones - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/modal.css">
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body>
    <!-- Skip link para accesibilidad -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Contenido principal -->
        <main class="main-content" id="main-content">
            <!-- Encabezado de página -->
            <div id="page-header-container"></div>

            <div class="page-body section-stack">
                <!-- Filtros -->
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Filtros de Devoluciones</h3></div>
                    <div class="card-body">
                        <div class="filter-grid">
                            <div class="form-group">
                                <label class="form-label">Tipo de Devolución</label>
                                <select class="form-input form-select" id="report-filter-type">
                                    <option value="sale">Ventas</option>
                                    <option value="purchase">Compras</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Desde</label>
                                <input type="date" class="form-input" id="report-filter-date-from">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Hasta</label>
                                <input type="date" class="form-input" id="report-filter-date-to">
                            </div>
                            <div class="filter-actions">
                                <button class="btn btn-primary w-full" id="btn-apply-filters">Generar Reporte</button>
                                <button class="btn btn-secondary w-full" id="btn-export-pdf">Exportar PDF</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabla -->
                <div class="card">
                    <div class="table-container">
                        <table class="table" id="report-table">
                            <thead><tr id="report-table-header"></tr></thead>
                            <tbody id="report-table-body"></tbody>
                        </table>
                    </div>
                    <div class="pagination">
                        <button class="pagination-btn" aria-label="Página anterior" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn" aria-label="Página siguiente">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <span class="pagination-info">Mostrando datos...</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Componentes -->
    <script type="module" src="/js/components/Sidebar.js"></script>
    <script type="module" src="/js/components/PageHeader.js"></script>
    <script type="module" src="/js/components/Modal.js"></script>

    <!-- Scripts de la página -->
    <script type="module" src="/js/pages/reports/returns.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</body>
</html>
