<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devoluciones de Venta - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/sale_returns.css">

    <link rel="icon" type="image/svg+xml" href="../assets/Nexus_Inventory_Logo.svg">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">

        <div id="sidebar-container"></div>

        <main class="main-content" id="main-content">

            <div id="page-header-container"></div>

            <div class="page-body section-stack">

                <!-- ── Acciones de la página ── -->
                <div class="page-actions">
                    <button class="btn btn-primary" id="btn-new-sale-return">
                        <span class="material-symbols-outlined">assignment_return</span>
                        Nueva Devolución
                    </button>
                </div>

                <!-- ── Filtros (según SaleReturnFilter del backend) ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Filtros</h3>
                    </div>
                    <div class="filter-grid">

                        <div class="form-group">
                            <label class="form-label" for="sale-returns-filter-sale-id">ID Venta</label>
                            <input type="number" class="form-input" id="sale-returns-filter-sale-id" placeholder="ID de la venta">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="sale-returns-filter-state">Estado</label>
                            <select class="form-input" id="sale-returns-filter-state">
                                <option value="">Todos los estados</option>
                                <option value="PENDING">Pendiente</option>
                                <option value="COMPLETED">Completada</option>
                                <option value="CANCELLED">Cancelada</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="sale-returns-filter-date-from">Desde</label>
                            <input type="date" class="form-input" id="sale-returns-filter-date-from">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="sale-returns-filter-date-to">Hasta</label>
                            <input type="date" class="form-input" id="sale-returns-filter-date-to">
                        </div>

                        <div class="filter-actions">
                            <button class="btn btn-secondary" id="btn-apply-filters">
                                <span class="material-symbols-outlined">filter_list</span>
                                Aplicar Filtros
                            </button>
                        </div>

                    </div>
                </div>

                <!-- ── Tabla ── -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nº Devolución</th>
                                    <th>Nº Venta</th>
                                    <th>Cliente</th>
                                    <th>Motivo</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="sale-returns-tbody">
                                <!-- Datos dinámicos del backend -->
                            </tbody>
                        </table>
                    </div>
                    <div id="sale-returns-pagination" class="pagination">
                        <button class="pagination-btn" aria-label="Página anterior" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn active">1</button>
                        <button class="pagination-btn" aria-label="Página siguiente">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <span class="pagination-info">Mostrando registros de devoluciones</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ── Modal: Crear Devolución de Venta ── -->
    <!-- (campos según POST /v1/sale-returns del backend) -->
    <div class="modal-backdrop" id="modal-new-sale-return" style="display:none;">
        <div class="modal modal-xl">
            <div class="modal-header">
                <h3 class="modal-title">Nueva Devolución de Venta</h3>
                <button class="modal-close" aria-label="Cerrar">&times;</button>
            </div>

            <form id="form-new-sale-return">
                <div class="modal-body">

                    <!-- Datos generales -->
                    <div class="form-group">
                        <label class="form-label" for="new-sale-return-sale">Venta a Devolver</label>
                        <select class="form-input" id="new-sale-return-sale" name="sale_id">
                            <option value="">Selecciona la venta</option>
                            <!-- Se rellena dinámico desde el backend -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-sale-return-reason">Motivo de la Devolución</label>
                        <textarea class="form-input" id="new-sale-return-reason" name="reason" rows="3" placeholder="Describe el motivo de la devolución..."></textarea>
                    </div>

                    <!-- Detalles: productos a devolver -->
                    <div class="return-details">
                        <div class="return-details-header">
                            <h4 class="return-details-title">Productos a Devolver</h4>
                            <button type="button" class="btn btn-secondary btn-sm" id="btn-add-product">
                                <span class="material-symbols-outlined">add</span>
                                Añadir Producto
                            </button>
                        </div>

                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th>Cantidad</th>
                                        <th>Precio Unitario</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="sale-return-details-tbody">
                                    <tr class="return-detail-row">
                                        <td>
                                            <select class="form-input" name="product_id">
                                                <option value="">Selecciona producto</option>
                                                <!-- Se rellena dinámico -->
                                            </select>
                                        </td>
                                        <td>
                                            <input type="number" class="form-input" name="quantity" placeholder="1" min="1" value="1">
                                        </td>
                                        <td>
                                            <input type="number" step="0.01" class="form-input" name="unit_price" placeholder="0.00">
                                        </td>
                                        <td class="return-detail-subtotal">€ 0.00</td>
                                        <td>
                                            <button type="button" class="table-action-btn danger btn-remove-row" title="Eliminar">
                                                <span class="material-symbols-outlined">delete</span>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Total -->
                        <div class="return-totals">
                            <div class="return-total-row return-total-final">
                                <span class="return-total-label">Total a Devolver:</span>
                                <span class="return-total-value" id="sale-return-total">€ 0.00</span>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-outlined">save</span>
                        Crear Devolución
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Componentes globales -->
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/page_header.js"></script>
    <!-- Lógica de la página -->
    <script src="../js/pages/sale_returns.js"></script>
</body>
</html>
