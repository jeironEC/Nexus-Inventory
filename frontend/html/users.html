<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/users.css">

    <link rel="icon" type="image/svg+xml" href="../assets/Nexus_Inventory_Logo.svg">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="app-layout">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <main class="main-content" id="main-content">

            <!-- Header -->
            <div id="page-header-container"></div>

            <div class="page-body section-stack">

                <!-- ── Filtros ── -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Filtros</h3>
                    </div>
                    <div class="filter-grid">

                        <div class="form-group">
                            <label class="form-label" for="users-filter-full-name">Nombre Completo</label>
                            <input type="text" class="form-input" id="users-filter-full-name" placeholder="Nombre o apellido...">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="users-filter-role">Rol</label>
                            <select class="form-input" id="users-filter-role">
                                <option value="">Todos los roles</option>
                                <!-- Se rellena dinámico desde el backend -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="users-filter-state">Estado</label>
                            <select class="form-input" id="users-filter-state">
                                <option value="">Todos los estados</option>
                                <option value="active">Activo</option>
                                <option value="inactive">Inactivo</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="users-filter-date-from">Desde</label>
                            <input type="date" class="form-input" id="users-filter-date-from">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="users-filter-date-to">Hasta</label>
                            <input type="date" class="form-input" id="users-filter-date-to">
                        </div>

                        <div class="filter-actions">
                            <button class="btn btn-secondary" id="btn-apply-filters">
                                <span class="material-symbols-outlined">filter_list</span>
                                Aplicar Filtros
                            </button>
                        </div>

                    </div>
                </div>

                <!-- ── Tabla ── -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>NIF</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th>Fecha Creación</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="users-tbody">
                                <!-- Datos dinámicos del backend -->
                            </tbody>
                        </table>
                    </div>
                    <div id="users-pagination" class="pagination">
                        <button class="pagination-btn" aria-label="Página anterior" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn active">1</button>
                        <button class="pagination-btn" aria-label="Página siguiente">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                        <span class="pagination-info">Mostrando registros de usuarios</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ── Modal: Crear Usuario ── -->
    <div class="modal-backdrop" id="modal-new-user" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Nuevo Usuario</h3>
                <button class="modal-close" aria-label="Cerrar">&times;</button>
            </div>

            <form id="form-new-user">
                <div class="modal-body">

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="new-user-first-name">Nombre</label>
                            <input type="text" class="form-input" id="new-user-first-name" name="first_name" placeholder="Juan">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="new-user-last-name">Apellidos</label>
                            <input type="text" class="form-input" id="new-user-last-name" name="last_name" placeholder="García López">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-user-email">Correo electrónico</label>
                        <input type="email" class="form-input" id="new-user-email" name="email" placeholder="usuario@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-user-nif">NIF</label>
                        <input type="text" class="form-input" id="new-user-nif" name="nif" placeholder="12345678X">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-user-password">Contraseña</label>
                        <input type="password" class="form-input" id="new-user-password" name="password" placeholder="••••••••">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-user-role">Rol</label>
                        <select class="form-input" id="new-user-role" name="role">
                            <option value="">Selecciona un rol</option>
                            <!-- Se rellena dinámico desde el backend -->
                        </select>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-outlined">save</span>
                        Crear Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Componentes globales -->
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/page_header.js"></script>
    <!-- Lógica de la página -->
    <script src="../js/pages/users.js"></script>
</body>
</html>
