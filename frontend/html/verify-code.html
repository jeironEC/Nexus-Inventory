<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos (reutiliza los del login) -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">

    <link rel="icon" type="image/svg+xml" href="../assets/Nexus_Inventory_Logo.svg">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <main id="main-content" class="login-page">
        <div class="login-container">

            <!-- Panel izquierdo - Branding -->
            <div class="login-panel-left">
                <div class="login-bg-pattern"></div>
                <div class="login-branding">
                    <h2 class="login-brand-title">Nexus Inventory</h2>
                    <p class="login-brand-desc">
                        Ingresa el código de verificación que hemos enviado a tu correo electrónico.
                    </p>

                    <div class="login-features">
                        <div class="login-feature">
                            <span class="material-symbols-outlined">123</span>
                            <span>Código OTP</span>
                        </div>
                        <div class="login-feature">
                            <span class="material-symbols-outlined">timer</span>
                            <span>Expiración</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panel derecho - Formulario -->
            <div class="login-panel-right">
                <div class="login-wrapper">

                    <div class="login-header">
                        <h1 class="login-title">Verificar Código</h1>
                        <p class="login-subtitle">Ingresa el código OTP de 6 dígitos enviado a tu correo.</p>
                    </div>

                    <form id="form-verify-code" class="login-form">

                        <div class="form-group">
                            <label class="form-label" for="otp-code">Código OTP (el código expira en 15 minutos)</label>
                            <input
                                type="text"
                                id="otp-code"
                                name="code"
                                class="form-input"
                                placeholder="000000"
                                maxlength="6"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                autocomplete="one-time-code"
                            >
                        </div>

                        <button type="submit" id="btn-verify" class="btn btn-primary btn-lg w-100">
                            <span class="material-symbols-outlined">check_circle</span>
                            Verificar código
                        </button>
                    </form>

                    <div class="login-footer">
                        <p class="login-footer-text">
                            ¿No recibiste el código?
                            <a href="forgot-password.html" class="login-support-link">Solicitar nuevo código</a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="../js/components/modal.js"></script>
    <script src="../js/pages/verify-code.js"></script>
</body>
</html>
