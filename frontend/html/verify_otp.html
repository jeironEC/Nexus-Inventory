<!DOCTYPE html>
<html lang="es">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar OTP - Nexus Inventory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pages/login.css">
    <link rel="stylesheet" href="/css/components/modal.css">

    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/Nexus_Inventory_Logo.png?v=3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body>
    <!-- Skip link para accesibilidad -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <main id="main-content" class="login-page">
        <div class="login-container">
            <!-- Panel izquierdo - Branding -->
            <div class="login-panel-left">
                <div class="login-bg-pattern"></div>
                <div class="login-branding">
                    <h2 class="login-brand-title">Nexus Inventory</h2>
                    <p class="login-brand-desc">
                        Ingresa el código de verificación que hemos enviado a tu correo electrónico.
                    </p>
                    <div class="login-features">
                        <div class="login-feature">
                            <span class="material-symbols-outlined">pin</span>
                            <span>Código OTP</span>
                        </div>
                        <div class="login-feature">
                            <span class="material-symbols-outlined">timer</span>
                            <span>Expiración</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panel derecho - Formulario de Verificación OTP -->
            <div class="login-panel-right">
                <div class="login-wrapper">
                    <!-- Título -->
                    <div class="login-header">
                        <h1 class="login-title">Verificar Código</h1>
                        <p class="login-subtitle">Ingresa el código OTP de 6 dígitos enviado a tu correo.</p>
                    </div>

                    <!-- Formulario -->
                    <form id="confirm-otp-form" class="login-form">
                        <!-- Email (hidden o readonly para mantener sesión) -->
                        <input type="hidden" id="email" name="email" value="">

                        <!-- OTP -->
                        <div class="form-group">
                            <label for="otp" class="form-label">Código OTP (El código expira en 15 minutos)</label>
                            <input
                                type="text"
                                id="otp"
                                name="otp"
                                class="form-input"
                                placeholder="Ingresa los 6 dígitos"
                                maxlength="6"
                                minlength="6"
                                required
                                autocomplete="one-time-code"
                                aria-describedby="otp-hint"
                            >
                        </div>

                        <!-- Botón submit -->
                        <button type="button" class="btn btn-primary btn-lg w-100" id="btn-submit">
                            <span class="material-symbols-outlined">check_circle</span>
                            Verificar código
                        </button>
                    </form>

                    <!-- Reenviar código -->
                    <div class="login-footer">
                        <p class="login-footer-text">
                            ¿No recibiste el código?
                            <a href="/html/forgot_password.html" class="login-support-link">Solicitar nuevo código</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="/js/components/Modal.js"></script>
    <script type="module" src="/js/pages/verify_otp.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</body>
</html>
