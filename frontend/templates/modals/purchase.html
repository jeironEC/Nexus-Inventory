<div class="modal-backdrop" id="modal-purchase" style="display:none;">
    <div class="modal modal-xxl">
        <div class="modal-header">
            <h3 class="modal-title">Nueva Compra</h3>
            <button class="modal-close" aria-label="Cerrar">&times;</button>
        </div>

        <form id="form-purchase">
            <div class="modal-body">

               <!-- Datos generales -->
                <div class="form-row form-row-2">
                    <div class="form-group">
                        <label class="form-label" for="new-purchase-company">Empresa</label>
                        <select class="form-input form-select" id="new-purchase-company" name="company_id"></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-purchase-supplier">Proveedor</label>
                        <select class="form-input form-select" id="new-purchase-supplier" name="supplier_id"></select>
                    </div>
                </div>

                <!-- Detalles: productos de la compra -->
                <div class="purchase-details-wrapper">
                    <div class="purchase-details-main">
                        <div class="purchase-details-header">
                            <h4 class="purchase-details-title">Productos</h4>
                            <button type="button" class="btn btn-secondary btn-sm" id="btn-add-purchase-detail">
                                <span class="material-symbols-outlined">add</span>
                                Añadir Producto
                            </button>
                        </div>

                        <div class="table-container">
                            <table class="table">
                                <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Costo Unitario</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="purchase-details-tbody">
                            <tr class="purchase-detail-row">
                                <td>
                                    <select class="form-input form-select no-choices" name="product_id"></select>
                                </td>
                                <td>
                                    <input type="number" class="form-input" name="quantity" placeholder="0" min="1" value="0">
                                </td>
                                <td>
                                    <input type="number" step="0.01" class="form-input" name="unit_cost" placeholder="0.00">
                                </td>
                                <td class="purchase-detail-subtotal">€ 0.00</td>
                                <td>
                                    <button type="button" class="btn-remove-detail" title="Eliminar">
                                        <span class="material-symbols-outlined">delete</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Card de totales -->
                    <div class="purchase-totals-card">
                        <h4 class="purchase-totals-card-title">Totales</h4>
                        <div class="purchase-totals-content">
                            <div class="totals-item">
                                <span class="totals-label">Subtotal</span>
                                <span class="totals-value" id="purchase-subtotal">€ 0.00</span>
                            </div>
                            <div class="totals-divider"></div>
                            <div class="totals-item totals-final">
                                <span class="totals-label">Total</span>
                                <span class="totals-value" id="purchase-total">€ 0.00</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    <span class="material-symbols-outlined">save</span>
                    Crear Compra
                </button>
            </div>
        </form>
    </div>
</div>
