<div class="modal-backdrop" id="modal-role">
    <div class="modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">Nuevo Rol</h3>
                    <button class="modal-close" aria-label="Cerrar">&times;</button>
                </div>
                <form id="form-role">
                    <div class="modal-body">
                        <div class="form-group">
                            <label class="form-label">Nombre *</label>
                            <select name="name" class="form-input form-select" id="role-name-select" required>
                                <option value="">Selecciona un rol</option>
                                <option value="admin">Admin</option>
                                <option value="cajero">Cajero</option>
                                <option value="encargado de ventas">Encargado de Ventas</option>
                                <option value="encargado de compras">Encargado de Compras</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Descripción</label>
                            <input type="text" name="description" class="form-input" id="role-description-input" readonly>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Crear Rol</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
