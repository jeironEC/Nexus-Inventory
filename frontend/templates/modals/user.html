<div class="modal-backdrop" id="modal-user" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Nuevo Usuario</h3>
            <button class="modal-close" aria-label="Cerrar">&times;</button>
        </div>
        <form id="form-user">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">NIF *</label>
                    <input type="text" name="nif" class="form-input" required pattern="^(?:[0-9]{8}[A-Z]|[A-Z][0-9]{7}[A-Z0-9])$" title="NIF español: 12345678A o B12345678">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="first_name" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Apellido</label>
                        <input type="text" name="last_name" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" name="email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña *</label>
                    <input type="text" name="password" class="form-input" required minlength="8">
                    <div class="password-requirements">
                        <div class="req" id="req-length"><span class="material-symbols-outlined">close</span> Min 8 caracteres</div>
                        <div class="req" id="req-upper"><span class="material-symbols-outlined">close</span> Mayúscula</div>
                        <div class="req" id="req-lower"><span class="material-symbols-outlined">close</span> Minúscula</div>
                        <div class="req" id="req-number"><span class="material-symbols-outlined">close</span> Número</div>
                        <div class="req" id="req-special"><span class="material-symbols-outlined">close</span> Carácter especial</div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Rol *</label>
                    <select name="role" class="form-input form-select" required></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                <button type="submit" class="btn btn-primary">Crear Usuario</button>
            </div>
        </form>
    </div>
</div>
